<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyro Biplane Dodge</title>
  <style>
    :root{--cyan:#67d7ff;--panel:rgba(6,15,32,.92)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101f;color:#eef7ff;font-family:Arial,sans-serif}
    #app{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;z-index:10;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}
    .hud-box{min-width:145px;padding:10px 14px;border:1px solid rgba(103,215,255,.35);border-radius:12px;background:var(--panel)}
    .label{color:#90a8c1;font-size:11px;letter-spacing:.15em;text-transform:uppercase}#score,#dodged{font-size:28px;font-weight:800}
    #status{position:absolute;z-index:10;left:18px;bottom:18px;max-width:calc(100vw - 36px);padding:10px 12px;border-radius:10px;background:var(--panel);color:#a8bdd3;font-size:12px}#status strong{color:var(--cyan)}
    #menu,#gameOver{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(3,9,20,.15),rgba(3,9,20,.72))}#gameOver{display:none}
    .card{width:min(460px,calc(100vw - 32px));padding:24px;text-align:center;border:1px solid rgba(103,215,255,.35);border-radius:18px;background:rgba(5,13,28,.96);box-shadow:0 24px 80px rgba(0,0,0,.55)}
    h1{margin:0 0 8px;font-size:32px}.subtitle{margin:0 0 18px;color:#9eb2c8;line-height:1.45}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{border:1px solid rgba(103,215,255,.25);border-radius:10px;padding:12px 10px;background:linear-gradient(135deg,#67d7ff,#9a8cff);color:#07101f;font-weight:800;cursor:pointer}button.secondary{background:rgba(12,26,48,.95);color:#ddecf8}#gameOver h1{color:#ff6d7a}#finalScore{font-size:48px;font-weight:900}
    @media(max-width:640px){.controls{grid-template-columns:1fr}.hud-box{min-width:120px}}
  </style>
  <!-- STLLoader imports the bare module name "three". This import map must precede all module scripts. -->
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}
  </script>
</head>
<body>
  <div id="app">
    <div id="hud"><div class="hud-box"><div class="label">Score</div><div id="score">0000</div></div><div class="hud-box" style="text-align:right"><div class="label">Dodged</div><div id="dodged">0</div></div></div>
    <div id="status">Source: <strong>Loading game</strong></div>
    <div id="menu"><div class="card"><h1>Biplane Dodge</h1><p class="subtitle">Tilt an MPU6050 connected to an Arduino Uno, use phone orientation, or use the keyboard.</p><div class="controls"><button id="startButton">Start Game</button><button id="deviceGyroButton" class="secondary">Use Phone Gyro</button><button id="usbButton" class="secondary">Connect Arduino USB</button><button id="keyboardButton" class="secondary">Use Keyboard</button></div></div></div>
    <div id="gameOver"><div class="card"><h1>Game Over</h1><div id="finalScore">0</div><p class="subtitle">Bullets avoided: <strong id="finalDodged">0</strong></p><button id="restartButton">Fly Again</button></div></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/STLLoader.js';

    const app=document.getElementById('app'), statusEl=document.getElementById('status');
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07101f); scene.fog=new THREE.Fog(0x07101f,110,300);
    const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,600); camera.position.set(0,0,145);
    const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); app.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xbfe6ff,0x18243a,2.2)); const keyLight=new THREE.DirectionalLight(0xffffff,2.4); keyLight.position.set(40,70,100); scene.add(keyLight);
    const stars=new THREE.BufferGeometry(), starPositions=[]; for(let i=0;i<450;i++)starPositions.push((Math.random()-.5)*260,(Math.random()-.5)*170,-20-Math.random()*250); stars.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3)); scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xaedcff,size:.55})));
    const plane=new THREE.Group(); plane.position.set(0,0,-18); scene.add(plane);
    let gameActive=false, score=0, dodged=0, startTime=0, lastSpawn=0, spawnInterval=1050, bulletSpeed=48, serialText='', usbPort=null, usbReader=null;
    const bullets=[], input={x:0,y:0,roll:0,pitch:0,active:false}, keys={ArrowLeft:false,ArrowRight:false,ArrowUp:false,ArrowDown:false,a:false,d:false,w:false,s:false};
    const hitbox=new THREE.Vector3(24,10,16);
    function setStatus(s){statusEl.innerHTML=s}
    function fallbackPlane(){const g=new THREE.Group(),m=new THREE.MeshPhongMaterial({color:0x66cfff,emissive:0x071a29,shininess:80});const f=new THREE.Mesh(new THREE.CapsuleGeometry(3,14,5,10),m);f.rotation.x=Math.PI/2;const w=new THREE.Mesh(new THREE.BoxGeometry(32,1.2,7),m);w.position.z=2;const w2=w.clone();w2.position.z=-6;const t=new THREE.Mesh(new THREE.BoxGeometry(9,1,4),m);t.position.z=-10;g.add(f,w,w2,t);plane.add(g)}
    function loadPlane(){new STLLoader().load('./Glorious%20Borwo-Bombul.stl',g=>{g.computeVertexNormals();g.computeBoundingBox();const center=g.boundingBox.getCenter(new THREE.Vector3()),size=g.boundingBox.getSize(new THREE.Vector3()),mesh=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0x66cfff,emissive:0x071a29,shininess:80,side:THREE.DoubleSide}));mesh.position.sub(center);mesh.scale.setScalar(62/(Math.max(size.x,size.y,size.z)||1));mesh.rotation.x=-Math.PI/2;plane.add(mesh);setStatus('Source: <strong>Biplane STL loaded</strong>')},undefined,()=>{fallbackPlane();setStatus('Source: <strong>Fallback plane</strong>')})}
    function spawnBullet(){const b=new THREE.Mesh(new THREE.SphereGeometry(2.2,10,8),new THREE.MeshStandardMaterial({color:0xff5364,emissive:0xff1836,emissiveIntensity:2}));b.position.set((Math.random()-.5)*82,(Math.random()-.5)*48,-210);scene.add(b);bullets.push(b)}
    function clearBullets(){for(const b of bullets){scene.remove(b);b.geometry.dispose();b.material.dispose()}bullets.length=0}
    function startGame(){clearBullets();score=0;dodged=0;spawnInterval=1050;bulletSpeed=48;startTime=performance.now();lastSpawn=startTime;plane.position.set(0,0,-18);document.getElementById('dodged').textContent='0';document.getElementById('menu').style.display='none';document.getElementById('gameOver').style.display='none';gameActive=true;setStatus('Source: <strong>Game active</strong>')}
    function endGame(){if(!gameActive)return;gameActive=false;document.getElementById('finalScore').textContent=String(Math.floor(score));document.getElementById('finalDodged').textContent=String(dodged);document.getElementById('gameOver').style.display='flex';setStatus('Source: <strong>Game over</strong>')}
    function setAngles(beta,gamma){if(beta==null||gamma==null)return;input.x=THREE.MathUtils.clamp(gamma/35,-1,1);input.y=THREE.MathUtils.clamp(beta/35,-1,1);input.roll=THREE.MathUtils.degToRad(gamma*.9);input.pitch=THREE.MathUtils.degToRad(beta*.9);input.active=true}
    async function enablePhone(){if(typeof DeviceOrientationEvent==='undefined'){setStatus('Source: <strong>Device gyro unsupported</strong>');return}const enable=()=>window.addEventListener('deviceorientation',e=>{setAngles(e.beta??0,e.gamma??0);setStatus('Source: <strong>Phone gyroscope</strong>')},true);if(typeof DeviceOrientationEvent.requestPermission==='function'){try{(await DeviceOrientationEvent.requestPermission())==='granted'?enable():setStatus('Source: <strong>Gyro permission denied</strong>')}catch{setStatus('Source: <strong>Gyro permission denied</strong>')}}else enable()}
    async function connectUSB(){if(!('serial'in navigator)){setStatus('Source: <strong>Web Serial unsupported - use Chrome or Edge on localhost/HTTPS</strong>');return}try{usbPort=await navigator.serial.requestPort();await usbPort.open({baudRate:115200});usbReader=usbPort.readable.getReader();const decoder=new TextDecoder();setStatus('Source: <strong>Arduino USB connecting</strong>');while(usbPort&&usbPort.readable){const {value,done}=await usbReader.read();if(done)break;serialText+=decoder.decode(value,{stream:true});const lines=serialText.split(/\r?\n/);serialText=lines.pop()||'';for(const line of lines){const t=line.trim();if(!t)continue;let r,p;try{const o=JSON.parse(t);r=Number(o.roll??o.x??0);p=Number(o.pitch??o.y??0)}catch{const parts=t.split(',');if(parts.length<2)continue;r=Number(parts[0]);p=Number(parts[1])}if(Number.isFinite(r)&&Number.isFinite(p)){input.x=THREE.MathUtils.clamp(p/35,-1,1);input.y=THREE.MathUtils.clamp(r/35,-1,1);input.roll=THREE.MathUtils.degToRad(r);input.pitch=THREE.MathUtils.degToRad(p);input.active=true;setStatus('Source: <strong>Arduino Uno MPU6050 USB</strong>')}}}}catch(e){console.error(e);setStatus('Source: <strong>USB connection failed</strong>')}}
    function keyboard(){input.active=false;setStatus('Source: <strong>Keyboard arrows / WASD</strong>')}
    document.getElementById('startButton').addEventListener('click',startGame);document.getElementById('restartButton').addEventListener('click',startGame);document.getElementById('deviceGyroButton').addEventListener('click',enablePhone);document.getElementById('usbButton').addEventListener('click',connectUSB);document.getElementById('keyboardButton').addEventListener('click',keyboard);
    window.addEventListener('keydown',e=>{if(e.key in keys)keys[e.key]=true});window.addEventListener('keyup',e=>{if(e.key in keys)keys[e.key]=false});
    function updateControls(){if(!input.active){input.x=0;input.y=0;if(keys.ArrowLeft||keys.a)input.x=-1;if(keys.ArrowRight||keys.d)input.x=1;if(keys.ArrowUp||keys.w)input.y=1;if(keys.ArrowDown||keys.s)input.y=-1}plane.position.x+=(input.x*72-plane.position.x)*.12;plane.position.y+=(input.y*-38-plane.position.y)*.12;plane.position.x=THREE.MathUtils.clamp(plane.position.x,-74,74);plane.position.y=THREE.MathUtils.clamp(plane.position.y,-43,43);plane.rotation.z+=(-input.x*.32-plane.rotation.z)*.12;plane.rotation.x+=(input.pitch*.45-plane.rotation.x)*.08;plane.rotation.y+=(input.roll*.45-plane.rotation.y)*.08}
    function updateBullets(dt,now){if(gameActive&&now-lastSpawn>spawnInterval){spawnBullet();lastSpawn=now;spawnInterval=Math.max(300,spawnInterval*.985);bulletSpeed=Math.min(140,bulletSpeed+1.1)}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.z+=bulletSpeed*dt;b.rotation.x+=dt*3;b.rotation.y+=dt*4;const dx=b.position.x-plane.position.x,dy=b.position.y-plane.position.y,dz=b.position.z-plane.position.z;if(gameActive&&Math.abs(dx)<hitbox.x*.55&&Math.abs(dy)<hitbox.y*.9&&Math.abs(dz)<hitbox.z*.7)endGame();if(b.position.z>155){scene.remove(b);b.geometry.dispose();b.material.dispose();bullets.splice(i,1);if(gameActive){dodged++;document.getElementById('dodged').textContent=String(dodged)}}}}
    let previousTime=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-previousTime)/1000,.05);previousTime=now;updateControls();if(gameActive){score=(now-startTime)/1000+dodged*25;document.getElementById('score').textContent=String(Math.floor(score)).padStart(4,'0')}updateBullets(dt,now);renderer.render(scene,camera)}
    window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    loadPlane();setStatus('Source: <strong>Ready - press Start Game</strong>');requestAnimationFrame(animate);
  </script>
</body>
</html>
